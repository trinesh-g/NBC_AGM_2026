<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>NBC AGM 2026 — Opening</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Rajdhani:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/opening.css" />
  </head>
  <body>
    <main class="opening" id="opening">
      <div class="noise"></div>
      <div class="vignette"></div>

      <section class="entry" id="entry">
        <div class="nbc-mark">nbc</div>
        <div class="rule"></div>
        <p>ANNUAL GENERAL MEETING</p>
        <button id="enterButton" type="button">
          ENTER EXPERIENCE <span>→</span></button
        ><small>SOUND ON</small>
      </section>

      <section class="start-sequence" id="startSequence">
        <div class="meta">INITIALISING // AGM 2026</div>
        <div class="lights"><i></i><i></i><i></i><i></i></div>
        <div class="number" id="number"></div>
        <div class="status" id="status">PREPARING THE GRID</div>
      </section>
      <div class="lights-out" id="lightsOut">LIGHTS OUT</div>
      <div class="wipe" id="wipe"></div>
    </main>

    <audio
      id="buttonHoverSound"
      preload="auto"
      src="assets/audio/button-hover.wav"
    ></audio>
    <audio
      id="countdown"
      preload="auto"
      src="assets/audio/countdown.wav"
    ></audio>
    <script type="module" src="js/opening.js"></script>
  </body>
</html>
