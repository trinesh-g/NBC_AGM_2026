<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NBC AGM 2026 — Ticket Switching Test</title>
  <style>
    body { margin: 0; padding: 40px; background: #030508; color: #fff; font-family: Arial, sans-serif; }
    h1 { color: #ef1722; }
    button { margin: 6px; padding: 12px 18px; cursor: pointer; }
    #result { margin-top: 20px; padding: 20px; border: 1px solid #333; }
  </style>
</head>
<body>
  <h1>Ticket Switching Test</h1>
  <p>Click an organisation to verify which ticket template the RSVP logic selects.</p>
  <div id="buttons"></div>
  <div id="result">No organisation selected.</div>

  <script src="ticket-templates.js"></script>
  <script>
    const organisations = [
      "NBC",
      "SACTWU",
      "ATASA",
      "SACMA",
      "EPCMA",
      "SAAA",
      "Other",
      "Unknown"
    ];

    const buttons = document.getElementById("buttons");
    const result = document.getElementById("result");

    organisations.forEach((organisation) => {
      const button = document.createElement("button");
      button.textContent = organisation;

      button.addEventListener("click", () => {
        const template = getTicketTemplate(organisation);

        result.innerHTML =
          "<strong>Selected:</strong> " +
          organisation +
          "<br><strong>Template:</strong> " +
          template.key +
          "<br><strong>Page:</strong> " +
          template.page;
      });

      buttons.appendChild(button);
    });
  </script>
</body>
</html>
